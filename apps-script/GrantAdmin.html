<!doctype html><html lang="ja"><head><base target="_top"><style>
*{box-sizing:border-box}body{margin:0;background:#eff4f5;color:#20343d;font:16px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px 16px}section{background:white;border:1px solid #d7e3e5;border-radius:12px;margin:18px 0;padding:20px}h1,h2{margin:0 0 14px}label{display:block;font-weight:650;margin:10px 0 4px}input,select,textarea{width:100%;font:inherit;padding:8px;border:1px solid #879ba2;border-radius:6px}button{font:inherit;border:0;border-radius:7px;padding:9px 16px;background:#136960;color:white;margin-top:12px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}textarea{min-height:180px}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px;border-bottom:1px solid #dde6e9;overflow-wrap:anywhere}#history{overflow:auto}#notice{white-space:pre-wrap}
</style></head><body><main>
<h1>Grant Forms Cloud 管理画面</h1>
<section><h2>新しい助成金フォーム</h2>
<form id="draft">
<label for="draft-title">助成金名</label><input id="draft-title" name="title" maxlength="180" required>
<label for="draft-year">年度</label><input id="draft-year" name="year" maxlength="32" placeholder="令和8年度" required>
<label for="draft-pdf">募集要項PDF（20 MBまで）</label>
<input id="draft-pdf" name="guidelines" type="file" accept=".pdf,application/pdf" required>
<label for="draft-fields">入力項目案</label><textarea id="draft-fields" name="fields" maxlength="4000" placeholder="企業名、担当者名、対象事業所など"></textarea>
<label for="draft-documents">提出書類案・必須条件</label><textarea id="draft-documents" name="documents" maxlength="4000" placeholder="登記事項証明書（法人のみ）など"></textarea>
<button type="submit">募集要項と項目案を下書き保存</button>
<p id="draft-status" role="status"></p>
</form>
<h3>保存済みの下書き</h3><ul id="drafts"></ul>
</section>
<section><h2>会社別の管理者入力項目</h2>
<p>申請先の入力欄と同じ名前で登録できます。各番号は「コピー」で申請画面へ貼り付けられます。</p>
<label for="company-records">登録済みの会社</label><select id="company-records"><option value="">新規登録</option></select>
<form id="company-data">
<label for="record-name">会社名</label><input id="record-name" maxlength="120" required>
<div id="number-rows"></div>
<button id="add-number" type="button">項目を追加</button>
<button type="submit">会社情報を保存</button>
<p id="number-status" role="status"></p>
</form></section>
<section><h2>会社向けリンクの発行</h2>
<form id="issue"><label for="grant">助成金フォーム</label><select id="grant" name="grant"><option value="women-r8">令和8年度 女性活躍情報公開促進奨励金</option></select>
<label for="company">会社名</label><input id="company" name="company" maxlength="120" required>
<label for="email">案内メールの宛先</label><input id="email" name="email" type="email" maxlength="180" required>
<button type="submit">専用リンクを発行</button></form>
<div id="preview" hidden>
<label for="link">会社専用リンク</label><input id="link" readonly>
<label for="to">宛先</label><input id="to" readonly>
<label for="subject">件名</label><input id="subject" readonly>
<label for="message">本文</label><textarea id="message" readonly></textarea>
<button id="send" type="button">この内容でメール送信</button></div>
<p id="notice" role="status"></p></section>
<section id="history"><h2>案内・提出履歴</h2>
<table><thead><tr><th>会社</th><th>助成金</th><th>宛先</th><th>送信日時</th><th>提出状況</th></tr></thead><tbody id="rows"></tbody></table>
<p id="empty" role="status"></p></section>
</main><script>
const issue = document.getElementById('issue');
const issueButton = issue.querySelector('button');
const preview = document.getElementById('preview');
const send = document.getElementById('send');
const notice = document.getElementById('notice');
const rows = document.getElementById('rows');
const empty = document.getElementById('empty');
let token;
const companyData = document.getElementById('company-data');
const companyRecords = document.getElementById('company-records');
const recordName = document.getElementById('record-name');
const numberRows = document.getElementById('number-rows');
const numberStatus = document.getElementById('number-status');
let numberRecords = [];
function addNumberRow(label = '', value = '') {
  const row = document.createElement('fieldset');
  row.innerHTML = '<label>項目名<input data-label maxlength="80"></label>' +
    '<label>番号・入力値<input data-value type="text" maxlength="120" autocomplete="off" spellcheck="false"></label>' +
    '<button type="button" data-copy>コピー</button> <button type="button" data-remove>項目を外す</button>';
  const valueInput = row.querySelector('[data-value]');
  row.querySelector('[data-label]').value = label;
  valueInput.value = value;
  row.querySelector('[data-copy]').onclick = async () => {
    if (!valueInput.value) { numberStatus.textContent = 'コピーする値を入力してください。'; return; }
    try {
      await navigator.clipboard.writeText(valueInput.value);
      numberStatus.textContent = 'コピーしました。';
    } catch (_) {
      valueInput.focus();
      valueInput.select();
      const copied = document.execCommand('copy');
      numberStatus.textContent = copied ? 'コピーしました。' : '選択した値を Ctrl+C でコピーしてください。';
    }
  };
  row.querySelector('[data-remove]').onclick = () => row.remove();
  numberRows.append(row);
}
function showNumberRecord() {
  const record = numberRecords.find(item => item.id === companyRecords.value);
  recordName.value = record ? record.name : '';
  numberRows.replaceChildren();
  const rows = record ? record.entries : [['労働保険番号',''],['雇用保険適用事業所番号','']];
  rows.forEach(([label,value]) => addNumberRow(label,value));
}
function refreshNumbers(selected = '') {
  google.script.run.withSuccessHandler(records => {
    numberRecords = records;
    companyRecords.replaceChildren(new Option('新規登録', ''));
    records.forEach(record => companyRecords.add(new Option(record.name, record.id)));
    companyRecords.value = selected;
    showNumberRecord();
  }).withFailureHandler(error => { numberStatus.textContent = error.message; }).listCompanyNumbers();
}
companyRecords.addEventListener('change', showNumberRecord);
document.getElementById('add-number').onclick = () => addNumberRow();
companyData.addEventListener('submit', event => {
  event.preventDefault();
  const button = companyData.querySelector('button[type=submit]');
  const entries = [...numberRows.children].map(row => [
    row.querySelector('[data-label]').value, row.querySelector('[data-value]').value
  ]).filter(([label,value]) => label.trim() || value.trim());
  button.disabled = true;
  companyRecords.disabled = true;
  google.script.run.withSuccessHandler(id => {
    button.disabled = false;
    companyRecords.disabled = false;
    numberStatus.textContent = '保存しました。';
    refreshNumbers(id);
  }).withFailureHandler(error => {
    button.disabled = false;
    companyRecords.disabled = false;
    numberStatus.textContent = error.message;
  }).saveCompanyNumbers({id:companyRecords.value,name:recordName.value,entries});
});
refreshNumbers();
const draft = document.getElementById('draft');
const draftStatus = document.getElementById('draft-status');
const draftList = document.getElementById('drafts');
function refreshDrafts() {
  google.script.run.withSuccessHandler(items => {
    draftList.replaceChildren();
    for (const item of items) {
      const row = document.createElement('li');
      const detail = document.createElement('details');
      const title = document.createElement('summary');
      title.textContent = item.year + ' ' + item.title;
      detail.append(title);
      const pdf = document.createElement('a');
      pdf.href = item.url;
      pdf.target = '_blank';
      pdf.rel = 'noopener noreferrer';
      pdf.textContent = '募集要項PDFを開く';
      detail.append(pdf);
      const notes = document.createElement('p');
      notes.style.whiteSpace = 'pre-wrap';
      notes.textContent = '入力項目案\n' + (item.fields || '未入力') + '\n\n提出書類案・必須条件\n' + (item.documents || '未入力');
      detail.append(notes);
      row.append(detail);
      draftList.append(row);
    }
  }).withFailureHandler(error => { draftStatus.textContent = error.message; }).listGrantDrafts();
}
draft.addEventListener('submit', event => {
  event.preventDefault();
  const file = draft.elements.guidelines.files[0];
  if (!file || !/\.pdf$/i.test(file.name) || file.size > 20 * 1024 * 1024) {
    draftStatus.textContent = '20 MB以内のPDFを選んでください。';
    return;
  }
  const button = draft.querySelector('button');
  button.disabled = true;
  draftStatus.textContent = '保存中…';
  google.script.run.withSuccessHandler(() => {
    draft.reset();
    button.disabled = false;
    draftStatus.textContent = '下書きを保存しました。';
    refreshDrafts();
  }).withFailureHandler(error => {
    button.disabled = false;
    draftStatus.textContent = error.message;
  }).saveGrantDraft(draft);
});
refreshDrafts();
function showError(error) { notice.textContent = error.message || '処理できませんでした。'; }
function refresh() {
  google.script.run.withSuccessHandler(entries => {
    rows.replaceChildren();
    empty.textContent = entries.length ? '' : '案内履歴はありません。';
    for (const item of entries) {
      const row = rows.insertRow();
      const grantName = document.getElementById('grant').querySelector('option[value="' + item.grant + '"]')?.textContent || item.grant;
      const sent = item.sentAt ? new Date(item.sentAt).toLocaleString('ja-JP', {timeZone:'Asia/Tokyo'}) :
        item.sending ? '送信結果を要確認' : '未送信';
      for (const value of [item.company, grantName, item.email, sent]) row.insertCell().textContent = value;
      const cell = row.insertCell();
      if (item.receipt && item.folderUrl) {
        const link = document.createElement('a');
        link.href = item.folderUrl;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = '提出済み・書類を開く';
        cell.append(link);
      } else cell.textContent = Date.now() > item.expiresAt ? '期限切れ' : '未提出';
    }
  }).withFailureHandler(error => { empty.textContent = error.message; }).listGrantInvitations();
}
issue.addEventListener('submit', event => {
  event.preventDefault();
  issueButton.disabled = true;
  preview.hidden = true;
  notice.textContent = '発行中…';
  google.script.run.withSuccessHandler(result => {
    token = result.token;
    for (const [id, value] of Object.entries({link:result.url,to:result.email,subject:result.subject,message:result.body})) {
      document.getElementById(id).value = value;
    }
    preview.hidden = false;
    send.disabled = false;
    issueButton.disabled = false;
    notice.textContent = 'リンクを発行しました。宛先と本文をご確認ください。';
    refresh();
  }).withFailureHandler(error => {
    issueButton.disabled = false;
    showError(error);
  }).createGrantInvitation(Object.fromEntries(new FormData(issue)));
});
send.addEventListener('click', () => {
  if (!token) return;
  send.disabled = true;
  issueButton.disabled = true;
  notice.textContent = '送信中…';
  google.script.run.withSuccessHandler(() => {
    issueButton.disabled = false;
    notice.textContent = '案内メールを送信しました。';
    refresh();
  }).withFailureHandler(error => {
    issueButton.disabled = false;
    showError(error);
    refresh();
  }).sendGrantInvitation(token);
});
refresh();
</script></body></html>
