<!doctype html><html lang="ja"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#172a39;font:16px/1.6 system-ui,sans-serif}
main{max-width:820px;margin:auto;padding:34px 18px 56px}header{border-top:5px solid #136960;padding:22px 24px;background:#fff;border-radius:12px;margin-bottom:18px}
h1{font-size:clamp(22px,4vw,32px);line-height:1.3;margin:0 0 12px}h2{font-size:20px;margin:0 0 12px}
section{background:#fff;border:1px solid #dce5e8;border-radius:12px;padding:22px 24px;margin:16px 0}p{margin:0 0 10px;color:#455b65}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.wide{grid-column:1/-1}
label{display:block;font-weight:650;margin-bottom:4px}input,textarea,select{width:100%;font:inherit;padding:9px;border:1px solid #91a5ab;border-radius:7px;background:#fff;color:inherit}textarea{resize:vertical}
.upload{padding:14px 0;border-top:1px solid #e2e9eb}.upload p{font-size:14px}.req{color:#9d2925;font-size:13px}.trap{position:absolute;left:-10000px}
button{background:#136960;color:#fff;border:0;border-radius:8px;padding:12px 24px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}#status{margin-top:12px;overflow-wrap:anywhere}
@media(max-width:580px){.grid{grid-template-columns:1fr}section,header{padding:18px}}

.help{white-space:pre-wrap;font-size:14px;margin:6px 0 0}.field-upload{grid-column:1/-1;padding:14px 0;border-top:1px solid #e2e9eb}#draft-status{margin-top:12px}#save-draft-bottom{margin-right:12px;margin-bottom:12px}</style></head><body><main><header><h1 id="title"></h1><p id="mode"></p><p>必要事項を入力し、書類を添付してください。途中の内容は一時保存できます。</p></header><form id="answers"><input name="inviteToken" type="hidden"><input name="revision" type="hidden"><input name="answersJson" type="hidden"><input name="website" type="text" hidden><button id="save-draft-top" type="button" disabled>入力内容を一時保存</button><p>同じ会社別リンクから再開できます。添付ファイルは再選択が必要です。</p><section><h2>申請情報・提出書類</h2><div id="fields" class="grid"></div></section><button id="save-draft-bottom" type="button" disabled>入力内容を一時保存</button><button type="submit" id="submit" disabled>入力内容・書類を送信</button></form><p id="draft-status" role="status"></p><p id="status" role="status"></p></main>
<script>
function applicantHeading(snapshot){const year=String(snapshot.year||'').trim();let title=String(snapshot.title||'').trim();if(year)while(title.startsWith(year))title=title.slice(year.length).trim();return [year,title].filter(Boolean).join(' ');}
const bootstrap=<?!= initial ?>;
function start(initial){let draftTimer,draftSaving=false,draftRequest=0;const form=document.getElementById('answers'),controls=new Map();document.getElementById('title').textContent=applicantHeading(initial.snapshot);document.getElementById('mode').textContent=initial.preview?'管理者プレビュー（送信できません）':'第'+initial.snapshot.revision+'版';form.elements.inviteToken.value=initial.token;form.elements.revision.value=initial.snapshot.revision;
for(const f of initial.snapshot.fields){
 const wrap=document.createElement('div'),label=document.createElement('label');label.textContent=f.label;if(f.required){const badge=document.createElement('span');badge.className='req';badge.textContent=' 必須';label.append(badge);}label.htmlFor='f_'+f.id;const el=document.createElement(f.type==='textarea'?'textarea':f.type==='select'?'select':'input');el.id='f_'+f.id;el.name=['file','file_word','file_excel'].includes(f.type)?'upload_'+f.id:'answer_'+f.id;
 if(f.type==='select'){el.add(new Option('選択してください',''));f.options.forEach(v=>el.add(new Option(v,v)));}else if(f.type!=='textarea')el.type=['file','file_word','file_excel'].includes(f.type)?'file':f.type==='checkbox'?'checkbox':f.type;
 if(['file','file_word','file_excel'].includes(f.type))el.accept=f.type==='file_excel'?'.xlsx,.xls':f.type==='file_word'?'.docx,.doc':'.pdf';else if(f.type==='checkbox'){el.style.width='auto';el.checked=initial.values[f.id]==='true';}else el.value=initial.values[f.id]??'';
 if(['text','textarea','email'].includes(f.type))el.maxLength=4000;
 if(['file','file_word','file_excel'].includes(f.type))wrap.className='field-upload';else if(f.type==='textarea'||/住所|所在地|備考/.test(f.label))wrap.className='wide';
 if(f.id==='company')el.maxLength=120;
 if(!initial.preview&&f.id==='email')el.readOnly=true;
 const help=document.createElement('p');help.className='help';help.textContent=f.help;wrap.append(label,el,help);document.getElementById('fields').append(wrap);controls.set(f.id,{f,el,wrap});el.addEventListener('change',()=>{update();queueDraft();});el.addEventListener('input',()=>{update();queueDraft();});
}
function values(){return Object.fromEntries([...controls].map(([id,{el,f}])=>[id,f.type==='checkbox'?(el.checked?'true':''):el.value]));}
function setDraftBusy(saving){for(const id of ['save-draft-top','save-draft-bottom']){const button=document.getElementById(id);button.disabled=saving||initial.preview||initial.submitted;button.textContent=initial.preview?'プレビューでは一時保存できません':initial.submitted?'提出済み':saving?'一時保存中…':'入力内容を一時保存';button.style.cursor=saving?'wait':button.disabled?'not-allowed':'pointer';}}
function saveDraftNow(){
 if(initial.preview||initial.submitted||draftSaving)return;clearTimeout(draftTimer);draftSaving=true;setDraftBusy(true);
 const request=++draftRequest,submitted=JSON.stringify(values()),message=document.getElementById('draft-status');message.textContent='一時保存中…（この画面を閉じずにお待ちください）';
 const timeout=setTimeout(()=>{if(request!==draftRequest)return;draftRequest++;draftSaving=false;setDraftBusy(false);message.textContent='保存の応答を確認できませんでした。入力内容は画面に残っています。再読み込みせず、通信を確認して「入力内容を一時保存」をもう一度押してください。';},45000);
 function finish(text){if(request!==draftRequest)return;clearTimeout(timeout);draftSaving=false;setDraftBusy(false);message.textContent=text;}
 try{google.script.run.withSuccessHandler(()=>{finish('入力内容を一時保存しました。同じリンクから再開できます（添付ファイルは再選択してください）。');if(request===draftRequest&&submitted!==JSON.stringify(values()))queueDraft();}).withFailureHandler(e=>finish('一時保存できませんでした：'+(e.message||'通信エラー'))).saveRequirementAnswerDraft({token:initial.token,revision:initial.snapshot.revision,answers:JSON.parse(submitted)});}catch(e){finish('一時保存できませんでした：'+e.message);}
}
for(const id of ['save-draft-top','save-draft-bottom'])document.getElementById(id).onclick=saveDraftNow;
setDraftBusy(false);
if(initial.preview){document.getElementById('mode').textContent='管理者プレビュー：入力の確認専用です。一時保存・提出はできません。保存する場合は管理画面で発行した「会社別リンク」を開いてください。';document.getElementById('mode').style.cssText='padding:14px;border:2px solid #a96916;background:#fff7e6;border-radius:8px';}
function queueDraft(){if(initial.preview||initial.submitted)return;clearTimeout(draftTimer);if(draftSaving)return;document.getElementById('draft-status').textContent='入力内容を保存予定…';draftTimer=setTimeout(saveDraftNow,1000);}
function update(){const v=values();for(const {f,el,wrap}of controls.values()){const show=f.enabled&&(!f.condition||String(v[f.condition.field]??'')===f.condition.equals);wrap.hidden=!show;el.disabled=!show||initial.submitted;el.required=show&&f.required;}}
update();document.getElementById('submit').disabled=initial.preview||initial.submitted;if(initial.submitted)document.getElementById('status').textContent='このリンクは提出済みです。変更は担当者へご連絡ください。';
form.addEventListener('submit',e=>{e.preventDefault();clearTimeout(draftTimer);if(initial.preview||initial.submitted)return;form.elements.answersJson.value=JSON.stringify(values());document.getElementById('submit').disabled=true;document.getElementById('status').textContent='保存中…';google.script.run.withSuccessHandler(r=>{document.getElementById('status').textContent='送信しました。受付ID：'+r.receipt;initial.submitted=true;for(const id of ['save-draft-top','save-draft-bottom'])document.getElementById(id).disabled=true;update();}).withFailureHandler(e=>{document.getElementById('submit').disabled=false;document.getElementById('status').textContent=e.message;}).submitRequirementApplication(form);});
}
if(bootstrap.preview)start(bootstrap);else google.script.run.withSuccessHandler(start).withFailureHandler(e=>{document.getElementById('status').textContent=e.message;}).getRequirementApplicantState(bootstrap.token);
</script></body></html>
