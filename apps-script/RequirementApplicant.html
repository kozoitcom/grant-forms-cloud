<!doctype html><html lang="ja"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px/1.6 system-ui;background:#eff4f5;color:#20343d;margin:0}main{max-width:850px;margin:auto;padding:24px}section{background:white;padding:24px;border-radius:12px}label{display:block;margin-top:20px;font-weight:bold}input,textarea,select{font:inherit;width:100%;box-sizing:border-box;padding:10px}button{padding:12px;background:#136960;color:white;border:0;border-radius:8px;font:inherit;margin-top:24px}.help{white-space:pre-wrap;color:#526973}</style></head><body><main><section><h1 id="title"></h1><p id="mode"></p><form id="answers"><input name="inviteToken" type="hidden"><input name="revision" type="hidden"><input name="answersJson" type="hidden"><input name="website" type="text" hidden><div id="fields"></div><button type="submit" id="submit" disabled>入力内容・書類を送信</button></form><p id="draft-status" role="status"></p><p id="status" role="status"></p></section></main>
<script>
const bootstrap=<?!= initial ?>;
function start(initial){let draftTimer;const form=document.getElementById('answers'),controls=new Map();document.getElementById('title').textContent=initial.snapshot.year+' '+initial.snapshot.title;document.getElementById('mode').textContent=initial.preview?'管理者プレビュー（送信できません）':'第'+initial.snapshot.revision+'版';form.elements.inviteToken.value=initial.token;form.elements.revision.value=initial.snapshot.revision;
for(const f of initial.snapshot.fields){
 const wrap=document.createElement('div'),label=document.createElement('label');label.textContent=f.label+(f.required?'（必須）':'');label.htmlFor='f_'+f.id;const el=document.createElement(f.type==='textarea'?'textarea':f.type==='select'?'select':'input');el.id='f_'+f.id;el.name=['file','file_word'].includes(f.type)?'upload_'+f.id:'answer_'+f.id;
 if(f.type==='select'){el.add(new Option('選択してください',''));f.options.forEach(v=>el.add(new Option(v,v)));}else if(f.type!=='textarea')el.type=['file','file_word'].includes(f.type)?'file':f.type==='checkbox'?'checkbox':f.type;
 if(['file','file_word'].includes(f.type))el.accept=f.type==='file_word'?'.docx,.doc':'.pdf';else if(f.type==='checkbox'){el.style.width='auto';el.checked=initial.values[f.id]==='true';}else el.value=initial.values[f.id]??'';
 if(['text','textarea','email'].includes(f.type))el.maxLength=4000;
 if(!initial.preview&&['company','email'].includes(f.id))el.readOnly=true;
 if(initial.preview){const tools=document.createElement('div');tools.style.cssText='display:flex;gap:8px;justify-content:flex-end';for(const [text,action] of [['↑',()=>move(f.id,-1)],['↓',()=>move(f.id,1)],['×',()=>{if(layoutSaving)return;f.enabled=false;layoutChanged();}],]){const b=document.createElement('button');b.type='button';b.textContent=text;b.setAttribute('aria-label',f.label+(text==='×'?'を削除':text==='↑'?'を上へ':'を下へ'));b.style.cssText='margin:0;padding:4px 12px';b.onclick=action;tools.append(b);}wrap.append(tools);}
 const help=document.createElement('p');help.className='help';help.textContent=f.help;wrap.append(label,el,help);document.getElementById('fields').append(wrap);controls.set(f.id,{f,el,wrap});el.addEventListener('change',()=>{update();queueDraft();});el.addEventListener('input',()=>{update();queueDraft();});
}
let layoutDirty=false,layoutSaving=false;
function move(id,direction){if(layoutSaving)return;const fields=initial.snapshot.fields,active=fields.filter(f=>f.enabled),i=active.findIndex(f=>f.id===id),other=active[i+direction];if(!other)return;const a=fields.findIndex(f=>f.id===id),b=fields.indexOf(other);[fields[a],fields[b]]=[fields[b],fields[a]];layoutChanged();}
function layoutChanged(){layoutDirty=true;for(const f of initial.snapshot.fields)document.getElementById('fields').append(controls.get(f.id).wrap);update();renderRemoved();document.getElementById('status').textContent='未保存の変更があります。変更を保存してください。';}
let removed;
function renderRemoved(){if(!removed)return;removed.replaceChildren();for(const f of initial.snapshot.fields.filter(f=>!f.enabled)){const b=document.createElement('button');b.type='button';b.textContent=f.label+'を復元';b.style.cssText='margin:8px;padding:6px';b.onclick=()=>{if(layoutSaving)return;f.enabled=true;layoutChanged();};removed.append(b);}}
if(initial.preview){const panel=document.createElement('div'),save=document.createElement('button'),note=document.createElement('p');save.type='button';save.textContent='変更を保存';save.style.marginTop='0';note.textContent='↑・↓で並べ替え、×で不要にします。保存すると元の必要項目にも反映します。申請者への反映は管理画面で公開してください。';removed=document.createElement('div');panel.append(save,note,removed);form.before(panel);renderRemoved();
 save.onclick=()=>{if(layoutSaving)return;layoutSaving=true;save.disabled=true;document.getElementById('status').textContent='保存中…';google.script.run.withSuccessHandler(r=>{initial.snapshot.revision=r.revision;form.elements.revision.value=r.revision;layoutDirty=false;layoutSaving=false;save.disabled=false;document.getElementById('status').textContent='変更を保存しました。管理画面で項目を読み込み直すと確認できます。';}).withFailureHandler(e=>{layoutSaving=false;save.disabled=false;document.getElementById('status').textContent=e.message;}).saveRequirementPreviewLayout({id:initial.definitionId,revision:initial.snapshot.revision,order:initial.snapshot.fields.map(f=>f.id),disabled:initial.snapshot.fields.filter(f=>!f.enabled).map(f=>f.id)});};
 window.addEventListener('beforeunload',e=>{if(layoutDirty){e.preventDefault();e.returnValue='';}});
}
function values(){return Object.fromEntries([...controls].map(([id,{el,f}])=>[id,f.type==='checkbox'?(el.checked?'true':''):el.value]));}
function queueDraft(){if(initial.preview||initial.submitted)return;clearTimeout(draftTimer);document.getElementById('draft-status').textContent='入力を保存中…';draftTimer=setTimeout(()=>google.script.run.withSuccessHandler(()=>{document.getElementById('draft-status').textContent='入力内容を一時保存しました（添付ファイルは再選択が必要です）。';}).withFailureHandler(e=>{document.getElementById('draft-status').textContent=e.message;}).saveRequirementAnswerDraft({token:initial.token,revision:initial.snapshot.revision,answers:values()}),1000);}
function update(){const v=values();for(const {f,el,wrap}of controls.values()){const show=f.enabled&&(!f.condition||String(v[f.condition.field]??'')===f.condition.equals);wrap.hidden=!show;el.disabled=!show||initial.submitted;el.required=show&&f.required;}}
update();document.getElementById('submit').disabled=initial.preview||initial.submitted;if(initial.submitted)document.getElementById('status').textContent='このリンクは提出済みです。変更は担当者へご連絡ください。';
form.addEventListener('submit',e=>{e.preventDefault();clearTimeout(draftTimer);if(initial.preview||initial.submitted)return;form.elements.answersJson.value=JSON.stringify(values());document.getElementById('submit').disabled=true;document.getElementById('status').textContent='保存中…';google.script.run.withSuccessHandler(r=>{document.getElementById('status').textContent='送信しました。受付ID：'+r.receipt;initial.submitted=true;update();}).withFailureHandler(e=>{document.getElementById('submit').disabled=false;document.getElementById('status').textContent=e.message;}).submitRequirementApplication(form);});
}
if(bootstrap.preview)start(bootstrap);else google.script.run.withSuccessHandler(start).withFailureHandler(e=>{document.getElementById('status').textContent=e.message;}).getRequirementApplicantState(bootstrap.token);
</script></body></html>
