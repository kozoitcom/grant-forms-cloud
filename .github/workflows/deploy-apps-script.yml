name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1
      - name: Configure Google authentication
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: |
          if [ -z "$CLASP_CREDENTIALS" ]; then
            echo "::error::GitHub secret CLASP_CREDENTIALS is not configured."
            exit 1
          fi
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
      - name: Push Apps Script files
        working-directory: apps-script
        run: clasp push --force
