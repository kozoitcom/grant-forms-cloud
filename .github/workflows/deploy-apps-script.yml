name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '.github/workflows/deploy-apps-script.yml'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only explicitly completed changes deploy. Intermediate source/test commits skip this job.
    # Publish all related files together in one commit with [deploy] in its message.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify system boundaries
        run: node --test tests/*.test.cjs
      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1
      - name: Configure Google authentication
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: |
          if [ -z "$CLASP_CREDENTIALS" ]; then
            echo "::error::GitHub secret CLASP_CREDENTIALS is not configured."
            exit 1
          fi
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
      - name: Push Apps Script files
        working-directory: apps-script
        shell: bash
        run: |
          set -euo pipefail
          verification_dir="$(mktemp -d)"
          trap 'rm -rf "$verification_dir"' EXIT
          if ! clasp status > "$verification_dir/status" 2>&1; then
            echo "::error::clasp could not determine the local upload files."
            exit 1
          fi
          for file in appsscript.json Index.html WomenR8.html GrantAdmin.html GrantSetupView.html ApplicantDataView.html DocumentTransferView.html GrantSetup.js ApplicantData.js DocumentTransfer.js ApplicantForms.js ApplicantFormsView.html MaterialBatch.js RequirementForms.js RequirementEditor.html RequirementApplicant.html コード.js; do
            if ! grep -Fq "$file" "$verification_dir/status"; then
              echo "::error::A required Apps Script file is missing from clasp status."
              exit 1
            fi
          done
          if ! clasp push --force > "$verification_dir/push" 2>&1; then
            echo "::error::Apps Script push failed."
            exit 1
          fi
          mkdir "$verification_dir/remote"
          cp .clasp.json "$verification_dir/remote/"
          if ! (cd "$verification_dir/remote" && clasp pull) > "$verification_dir/pull" 2>&1; then
            echo "::error::Could not read the synced Apps Script project."
            exit 1
          fi
          for file in appsscript.json Index.html WomenR8.html GrantAdmin.html GrantSetupView.html ApplicantDataView.html DocumentTransferView.html GrantSetup.js ApplicantData.js DocumentTransfer.js ApplicantForms.js ApplicantFormsView.html MaterialBatch.js RequirementForms.js RequirementEditor.html RequirementApplicant.html コード.js; do
            if [[ "$file" == *.js ]]; then
              remote_file="$verification_dir/remote/$file"
              [[ -f "$remote_file" ]] || remote_file="$verification_dir/remote/${file%.js}.gs"
            else
              remote_file="$verification_dir/remote/$file"
            fi
            if [[ ! -f "$remote_file" ]]; then
              echo "::error::A required file is missing from the Apps Script project after push."
              exit 1
            fi
            if [[ "$file" == appsscript.json ]]; then
              continue
            fi
            if ! diff -q --strip-trailing-cr "$file" "$remote_file" > /dev/null; then
              echo "::error::The Apps Script file contents differ from GitHub after push."
              exit 1
            fi
          done
          echo "Verified Apps Script files and application source after push."

      - name: Update existing web app deployment
        working-directory: apps-script
        shell: bash
        run: |
          set -euo pipefail
          if ! clasp deploy --deploymentId AKfycbxVXKLufKA_db9AYTH7BNSJYnFKv0weC1Yadiyqv_cSJ9NDj2YHNPmrZuMRcMRkzoA --description "GitHub ${GITHUB_SHA:0:12}" > /tmp/grant-deploy-result 2>&1; then
            echo "::error::Web app deployment update failed."
            exit 1
          fi
          echo "Updated existing web app deployment."

